<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin · Library Monitor Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #3498db 0%, #5dade2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            width: 100%;
            max-width: 400px;
        }
        .login-box h1 {
            color: #2c3e50;
            margin-bottom: 8px;
            text-align: center;
        }
        .login-box .subtitle {
            color: #7f8c8d;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .login-box .icon-top {
            text-align: center;
            font-size: 48px;
            color: #3498db;
            margin-bottom: 16px;
        }
        .login-box label {
            display: block;
            color: #2c3e50;
            margin-bottom: 6px;
            margin-top: 16px;
            font-weight: 500;
            font-size: 14px;
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }
        .login-box input:focus {
            outline: none;
            border-color: #3498db;
        }
        .login-box button {
            width: 100%;
            padding: 14px;
            margin-top: 24px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .login-box button:hover { background: #2980b9; }
        .erro {
            background: #fee;
            color: #c0392b;
            padding: 12px;
            border-radius: 8px;
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
            display: none;
        }
        .voltar {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #7f8c8d;
            text-decoration: none;
            font-size: 14px;
        }
        .voltar:hover { color: #3498db; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="icon-top"><i class="fas fa-shield-alt"></i></div>
        <h1>Área de Administração</h1>
        <p class="subtitle">Library Monitor Pro</p>

        <form id="loginForm">
            <label for="username">Utilizador</label>
            <input type="text" id="username" name="username" required autofocus>

            <label for="password">Palavra-passe</label>
            <input type="password" id="password" name="password" required>

            <button type="submit"><i class="fas fa-sign-in-alt"></i>&nbsp; Entrar</button>
        </form>

        <div class="erro" id="erro">Credenciais inválidas. Tenta novamente.</div>

        <a href="index.html" class="voltar"><i class="fas fa-arrow-left"></i> Voltar ao dashboard</a>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);

            const res = await fetch('../backend/admin_login.php', {
                method: 'POST',
                body: formData
            });
            const data = await res.json();

            if (data.sucesso) {
                window.location.href = 'admin-dashboard.html';
            } else {
                document.getElementById('erro').style.display = 'block';
                document.getElementById('password').value = '';
            }
        });
    </script>
</body>
</html>
